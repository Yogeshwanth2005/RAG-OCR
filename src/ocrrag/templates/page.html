<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @page { size: A4; margin: 0; }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { width: __PAGE_W__px; height: __PAGE_H__px; overflow: hidden; }
  #page {
    box-sizing: border-box;
    width: __PAGE_W__px;
    height: __PAGE_H__px;
    padding: __MARGIN__px;
    overflow: hidden;
    background: #ffffff;
    color: #000000;
    font-family: __FONT__;
    font-size: __FONT_PX__px;
    line-height: 1.5;
  }
  #content { height: 100%; overflow: hidden; }
  #content.two_col { column-count: 2; column-gap: __MARGIN__px; }
  #content p { margin: 0 0 0.6em 0; text-align: justify; }
</style>
</head>
<body>
<div id="page">
  <div id="content" class="__LAYOUT__">
__BODY__
  </div>
</div>
</body>
</html>
